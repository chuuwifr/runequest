name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions nécessaires pour GitHub Pages et la création/mise à jour de la branche gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Compilation de l'application statique
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Compilation Vite pour GitHub Pages (Chemins relatifs)
        run: npx vite build --base="./"

      - name: Configuration GitHub Pages (nojekyll & 404 fallback)
        run: |
          touch dist/.nojekyll
          if [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload de l'artefact GitHub Pages (Pour mode GitHub Actions)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publication sur branche gh-pages (Méthode Universelle)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
        continue-on-error: true

  deploy-pages:
    name: Déploiement automatique GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement sur GitHub Pages (Action officielle)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
